name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (web)
        run: pnpm --filter @rebuzzle/web lint

      - name: Typecheck (packages + web)
        run: >
          pnpm --filter @rebuzzle/config
          --filter @rebuzzle/game-logic
          --filter @rebuzzle/ui
          --filter @rebuzzle/web
          typecheck

      - name: Unit tests (web)
        run: pnpm --filter @rebuzzle/web exec jest --ci --passWithNoTests
        env:
          NODE_ENV: test
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @rebuzzle/web exec playwright install chromium --with-deps

      - name: Run Playwright e2e
        run: pnpm --filter @rebuzzle/web test:e2e
        env:
          CI: "1"
          NODE_ENV: test
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          AUTH_SECRET: playwright-test-auth-secret-32chars!!
          CRON_SECRET: playwright-cron-secret
          MONGODB_URI: mongodb://127.0.0.1:27017/rebuzzle-e2e
          RESEND_FROM_EMAIL: notifications@byronwade.com
