name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve for players or contributors?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about
  - type: dropdown
    id: target
    attributes:
      label: Primary area
      options:
        - Web gameplay
        - Admin / AI tooling
        - Desktop
        - Mobile
        - Docs / DX
        - Other
    validations:
      required: true
